<!doctype html>
<!-- Source for public/og-v2.png (1200x630). Regenerate: npm run og -->
<html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#02040a;position:relative;font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
.glow{position:absolute;left:-10%;right:-10%;top:300px;height:420px;
 background:radial-gradient(ellipse 55% 100% at 50% 0%,rgba(0,170,255,.55),rgba(0,80,255,.18) 45%,transparent 72%)}
.floor{position:absolute;left:0;right:0;top:340px;height:290px;overflow:hidden;
 -webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.25) 100%)}
.floor div{position:absolute;left:-50%;right:-50%;top:0;height:1400px;transform-origin:50% 0;transform:perspective(420px) rotateX(72deg);
 background-image:linear-gradient(rgba(40,190,255,.65) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(40,190,255,.65) 1.5px,transparent 1.5px);background-size:70px 70px;background-position:center top}
.line{position:absolute;left:0;right:0;top:339px;height:2px;
 background:linear-gradient(90deg,transparent,#2ee6ff 30%,#fff 50%,#2ee6ff 70%,transparent);box-shadow:0 0 22px 4px rgba(0,200,255,.7)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(120,200,255,.18) 1px,transparent 1.2px);background-size:28px 28px;
 -webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 30%,#000,transparent 75%)}
h1{position:absolute;left:0;right:0;top:170px;text-align:center;font-size:150px;font-weight:700;letter-spacing:-.055em;line-height:1;
 background:linear-gradient(180deg,#fff 30%,#8fdcff 100%);-webkit-background-clip:text;color:transparent;
 filter:drop-shadow(0 0 18px rgba(0,170,255,.4))}
</style></head><body>
<div class="dots"></div><div class="glow"></div><div class="floor"><div></div></div><div class="line"></div>
<h1>FactoryFlow</h1>
</body></html>
