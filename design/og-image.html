<!doctype html>
<!-- Source for public/og-image.png (1200x630). Regenerate: npm run og -->
<html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#04070f;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#e8f4ff;position:relative}
.bg{position:absolute;inset:0;background:
 radial-gradient(ellipse 700px 420px at 85% 30%,rgba(0,150,255,.35),transparent 70%),
 radial-gradient(ellipse 600px 400px at 0% 100%,rgba(0,90,255,.28),transparent 70%),#04070f}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,200,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,.08) 1px,transparent 1px);background-size:48px 48px;
 -webkit-mask-image:linear-gradient(115deg,transparent 20%,#000 90%)}
.frame{position:absolute;inset:28px;border:1.5px solid rgba(0,229,255,.55);box-shadow:0 0 24px rgba(0,229,255,.35),inset 0 0 24px rgba(0,229,255,.12);
 clip-path:polygon(0 0,calc(100% - 40px) 0,100% 40px,100% 100%,40px 100%,0 calc(100% - 40px))}
.tag{position:absolute;left:84px;top:78px;font:600 17px "SF Mono",Menlo,monospace;letter-spacing:.28em;color:#00e5ff;text-shadow:0 0 12px rgba(0,229,255,.8)}
.tag i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#00e5ff;box-shadow:0 0 12px #00e5ff;margin-right:14px}
h1{position:absolute;left:80px;top:190px;font-size:150px;font-weight:800;letter-spacing:-.04em;line-height:1;color:#fff;text-shadow:0 0 13px rgba(0,229,255,.63),0 0 35px rgba(0,120,255,.56)}
h1 span{color:#00e5ff}
.sub{position:absolute;left:86px;top:360px;width:900px;font-size:36px;font-weight:600;line-height:1.25;color:#cfe9ff}
.sub b{color:#00e5ff;font-weight:600}
.url{position:absolute;left:86px;bottom:66px;font:500 20px "SF Mono",Menlo,monospace;color:#5fb8e8;letter-spacing:.08em}
</style></head><body>
<div class="bg"></div><div class="grid"></div><div class="frame"></div>
<div class="tag"><i></i>LIVE FACTORY SIMULATION</div>
<h1>Factory<span>Flow</span></h1>
<div class="sub">See your factory <b>think</b>.<br>Every order, machine and minute — in real time.</div>
<div class="url">FACTORYFLOW.DJM-APPS.COM</div>
</body></html>
