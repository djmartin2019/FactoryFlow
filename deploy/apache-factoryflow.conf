# FactoryFlow static site. Template: review before installing.
# Install (on the VPS, as david):
#   sudo cp deploy/apache-factoryflow.conf /etc/apache2/sites-available/factoryflow.djm-apps.com.conf
#   sudo a2enmod headers expires   # if not already enabled
#   sudo apachectl configtest && sudo a2ensite factoryflow.djm-apps.com && sudo systemctl reload apache2
#   sudo certbot --apache -d factoryflow.djm-apps.com   # creates the matching :443 vhost
# Does not touch any other site's vhost, port, certificate or directory.

<VirtualHost *:80>
    ServerName factoryflow.djm-apps.com
    DocumentRoot /var/www/factoryflow/current

    <Directory /var/www/factoryflow/current>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Content-hashed bundles: safe to cache for a year.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # Entry point and mutable data must revalidate so a release never mixes old JS with new JSON.
    <LocationMatch "^/(index\.html)?$">
        Header set Cache-Control "no-cache"
    </LocationMatch>
    <LocationMatch "^/data/">
        Header set Cache-Control "no-cache"
    </LocationMatch>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
    </IfModule>

    # Missing files must 404, never fall back to index.html (no client-side routing).
    Header always set X-Content-Type-Options "nosniff"

    ErrorLog ${APACHE_LOG_DIR}/factoryflow-error.log
    CustomLog ${APACHE_LOG_DIR}/factoryflow-access.log combined
</VirtualHost>
